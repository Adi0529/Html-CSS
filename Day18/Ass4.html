<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
      .btn{
        background-color: #eaa629;
      }
      button:hover{
        background-color: rgb(58, 144, 1);
      }
    </style>
  </head>
  <body class="d-flex align-items-center vh-100 w-100 " style="background-image: linear-gradient(#ce4cdd, #eaa629)">
    <div class="mx-auto  d-flex flex-column bg-light py-5 px-5 rounded-4 " style="max-width: 40%;">
      <h2 class="text-center my-0 pb-md-3 mb-3 pb-5">Login</h2>
      <input type="Email" placeholder="Your email" class="px-3 py-2 mb-4 fs-5 rounded-3">
      <input type="Passsword" placeholder="Password" class="px-3 py-2 mb-4 fs-5 rounded-3">
      <button class="btn border-2 border-dark mx-auto align-self-start fs-5 mb-4" >Login</button>
      <p class="lead text-center mb-2 m-0 " >Or <a href="">Sign up</a> <br> </p>
      <p class="lead text-center m-0">Forget Credentials ? <a href="">Forget</a></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
