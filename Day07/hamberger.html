<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            padding: 15px 20px;
            color: white;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 18px;
        }

        .menu-toggle {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* Mobile Design */

        @media (max-width:768px) {

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 60px;
                right: 0;
                background: #333;
                width: 200px;
            }

            .nav-links li {
                margin: 15px 0;
                text-align: center;
            }

            .menu-toggle {
                display: block;
            }

            .nav-links.active {
                display: flex;
            }

        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">MyLogo</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="menu-toggle" id="menu">
            ☰
        </div>

    </nav>

    <script>

        const toggle = document.getElementById("menu");
        const nav = document.querySelector(".nav-links");

        toggle.addEventListener("click", function () {
            nav.classList.toggle("active");
        });

    </script>

</body>

</html>
