<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .sidebar{
            background-color: rgb(212, 212, 63);
            padding: 40px;
            
            width: 200px;
            
        }
        .sidebar ul {
            list-style-type: none;
            padding: 0;
            
        }
        .sidebar ul li {
            margin: 10px 0;
            font-size: 18px;
            padding: 10px;
            
        }
        .sidebar ul li a {
            text-decoration: none;
            color: black;
        }
        .sidebar ul li a:hover {
            color: rgb(243, 255, 246);
        }
        .sidebar ul li:hover {
            background-color: rgb(50, 211, 90);
            display: block;
        }
        h2{
            color: rgb(15, 15, 15);
            text-align: center;
            box-sizing: border-box;padding: 10px;
            
            width: 100%;
        }
        h1{
            color: rgb(194, 190, 190);
            text-align: center;
            padding: 10px;
            background-color: black;
            width: 100%;

        }
        img{
            display: block;
            margin: 20px auto;
            width: 600px;
            height: 400px;
            border-radius: 10px;
        }
        .main-content{
            background-color: rgb(226, 144, 22);
            flex: 1;
            width: 100%;
            height: 100%;
            padding: 20px;
        }
        @media (max-width: 1000px) {
        .container {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            height: 100px;
            padding-top: 10px;
        }
        .sidebar ul{
            display: flex;
            justify-content:space-evenly;
        }       
         .main-content {
            width: 100%;
            height: auto;
        }
  }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Sidebar</h2>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Profile</a></li>
                <li><a href="#">Settings</a></li>
                <li><a href="#">Logout</a></li>
            </ul>
        </div>
        <div class="main-content">
            <h1>Main Content</h1>
            <img src="img/car.jpg" alt="">
            <p>This is the main content area.</p>
    </div>
</body>
</html>
