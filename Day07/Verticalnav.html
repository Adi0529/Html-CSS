<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    header{
        background-color: rgb(148, 31, 194);
        color: bisque;
        padding: 5px 10px;
        text-align: center;
    }
    nav{
       
        background-color: rgb(226, 144, 22);
        margin: 20px;
        padding: 10px;
        
    }
    li{
        list-style-type: none;
        padding: 10px;
        border-bottom: 1px solid black;
       
        
    }
    li a{
        text-decoration: none;
        color: black;
        font-size: 18px;
        padding-left: 20px;
    }
    li a:hover{
        color: white;
    }
    li:hover{
        background-color: rgb(35, 210, 76);
        color: white;
    }
</style>
<body>
    <header>
        <h1>Simple vertical Navigation bar</h1>
    </header>
    <nav>
        
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
       
    </nav>
</body>
</html>
