<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #23bcda;
            margin: 0;
            padding: 20px;
        }
        p {
            text-align: center;
            color: #111010;
            font-size: 18px;
            margin-left: 10px;
            margin-right: 10px;
            margin-bottom: 20px;
        }
        h1 {
            margin-top: 0;
            text-align: center;
            color: aliceblue;
            padding: 10px;
            background-color: #111010;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .grid-item {
            border: 1px solid #111010;
            border-radius: 10px;
            height: 300px;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            transition: transform 0.3s ease;
    
        }
        .grid-item img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>
      Luxary and classic cars  
    </h1>
    <p>Explore our collection of luxury and classic cars.Your journey through time and elegance starts here and We are eager to share our passion with you.We are committed to providing the finest vehicles for discerning customers.</p>
    <div class="grid-container">
        <div class="grid-item"><img src="img/1.jpg" alt=""></div>
        <div class="grid-item"><img src="img/2.avif" alt=""></div>
        <div class="grid-item"><img src="img/3.avif" alt=""></div>
        <div class="grid-item"><img src="img/4.jpg" alt=""></div>
        <div class="grid-item"><img src="img/5.jpg" alt=""></div>
        <div class="grid-item"><img src="img/6.jpg" alt=""></div>
        <div class="grid-item"><img src="img/7.avif" alt=""></div>
        <div class="grid-item"><img src="img/8.jpg" alt=""></div>
        <div class="grid-item"><img src="img/8.jpg" alt=""></div>
        
    </div>
</body>
</html>
