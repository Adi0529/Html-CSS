<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 800px;
            
        }
        .ani{
            background-color: red;
            border-radius: 50%;
            width:50px;
            height: 50px;
            justify-content: center;
            animation: jump 3s linear 2s infinite;
        }
        @keyframes jump {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-200px);
            }
            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="ani">

    </div>
</body>
</html>
