<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 100%;
            height: 100vh;
            align-content: center;
        }
        .container{
            width:80%;
            height: 600px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows:repeat(3,1fr);
            gap: 20px;
            overflow: hidden;
            background-color: aqua;
            
        }
        .items{
            width: 100px;
            height: 100px;
            display: inline-block;
            margin: auto;
            background-color: bisque;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>

    </div>
</body>
</html>
