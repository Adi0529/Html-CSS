<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            width: 100%;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .Container{
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-areas: 'h h h h'
                                 's m m m'
                                 's m m m'
                                 's m m m'
                                 's c1 c2 c3'
                                 's c1 c2 c3'
                                 's c1 c2 c3'
                                 's f f f'
                                 's f f f';
            gap: 10px;
        }
        h2{
            text-align: center;
            align-content: center;
           
        }
        .item1{
            grid-area: h; background-color: rgb(0, 195, 255);
            border: 2px solid black;
            width: 100%;
            height: 100%;
            align-content: center;
            

        }
        .item2{
            grid-area: s;
             background-color: rgb(0, 195, 255);
            border: 2px solid black;
            width: 100%;
            height: 100%;
            align-content: center;
        }
        .item3{
            grid-area: m;
             background-color: rgb(0, 195, 255);
            border: 2px solid black;
            width: 100%;
            height: 100%;
            align-content: center;
        }
        .item4{
            grid-area: c1;
            background-color: rgb(0, 195, 255);
            border: 2px solid black;
            width: 100%;
            height: 100%;
            align-content: center;
        }
        .item5{
            grid-area: c2;
             background-color: rgb(0, 195, 255);
            border: 2px solid black;
            width: 100%;
            height: 100%;
            align-content: center;
        }
        .item6{
            grid-area: c3;
             background-color: rgb(0, 195, 255);
            border: 2px solid black;
            width: 100%;
            height: 100%;
            align-content: center;
        }
        .item7{
            grid-area: f;
             background-color: rgb(0, 195, 255);
            border: 2px solid black;
            width: 100%;
            height: 100%;
            align-content: center;
        }
        @media (max-width: 700px) {  /* Fixed: added 'px' */
            .Container{
                grid-template-areas: 'h'
                                     's'
                                     'm'
                                     'm'
                                     'm'
                                     'c1'
                                     'c1'
                                     'c2'
                                     'c2'
                                     'c3'
                                     'c3'
                                     'f';
            }
        }
    </style>
</head>
<body>
    <div class="Container">
        <div class="item1">
            <h2>Header</h2>
        </div>
        <div class="item2">
            <h2>Sidebar</h2>
        </div>
        <div class="item3">
            <h2>Main</h2>
        </div>
        <div class="item4">
            <h2>Content1</h2>
        </div>
        <div class="item5">
            <h2>Content2</h2>
        </div>
        <div class="item6">
            <h2>Content3</h2>
        </div>
        <div class="item7">
            <h2>Footer</h2>
        </div>
    </div>
</body>
</html>
