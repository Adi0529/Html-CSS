<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        color: bisque;
        background-color: black;
        padding: 10px;
        text-align: center;
    }
    nav{
        background-color: rgb(235, 216, 168);

        margin: 10px 5px;
        padding: 10px;
        
    }
    ul{
        list-style-type: none;
        display: flex;
       
    }
    li a{
        text-decoration: none;
        color: black;
        font-size: 18px;
        padding: 10px;
        display: block;
       
    }   
    ul li{
        float: left;
    }
    ul li:hover{
        background-color:  rgb(222, 202, 152);
       
    }
    ul li a:hover{
        color: white;
    }
    img{
        width: 100px;
        height: 40px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 0;
    }
</style>
<body>
    <header>
        <h1>Simple Header Bar</h1>
        <nav>
            <ul>
                <img src="img/logo.png" alt="">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
