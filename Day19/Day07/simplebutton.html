<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(226, 144, 22);
        }
        button{
            padding: 10px 20px;
            font-size: 16px;
            background-color: rgb(247, 64, 226);
            color: white;
            border: 1px solid black;
            border-radius: 10px;
            cursor: pointer;
            border-radius: 7px;
        }
        button:hover{
            background-color: rgb(35, 210, 76);
        }
    </style>
</head>
<body>
    <h1>Simple Button Example</h1> 
    <br>
    <button>Click Me!</button>
</body>
</html>
