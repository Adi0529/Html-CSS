<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            align-content: center;
            justify-content: center;
            align-items: center;
        }
        .container{
            width: 550px;
            height: 550px;
            background-color: rgb(222, 189, 26);
        }
        .gallary{
            align-content: center;
            width: 600px;
            height: 600px;
            display: grid;
            
            grid-template-rows: repeat(3,1fr);
            grid-template-columns: repeat(3,1fr);
            gap: 5px;
            padding-top: 20px;
            padding-left: 20px ;
            
        }
        img{
            width: 200px;
            height: 200px;
         
            
        }
        .animal{
            border-radius: 50%;
        }
        .background{
            border-radius: 50%;
            corner-shape: scoop;
            transform: rotate(45deg) scale(1.1);
        }
        .r2{
            margin-top: -50px;
        }
        .r3{
            margin-top: -100px;
        }
        .c2{
            margin-left: -50px;
        }
        .c3{
            margin-left: -100px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="gallary">
        <img src="./img/sox.webp" alt="" class="animal">
        <img src="img/red.webp" alt="" class="background c2">
        <img src="img/tiger.webp" alt="" class="animal c3">
        <img src="img/snow.jpeg" alt="" class="background r2">
        <img src="img/Lion.jpg" alt="" class="animal r2 c2">
        <img src="img/Trees.jpg" alt="" class="background r2 c3">
        <img src="img/fox2.jpg" alt="" class="animal r3">
        <img src="img/sea.jpg" alt="" class="background r3 c2">
        <img src="img/BEAR.jpg" alt="" class="animal r3 c3">
        </div>
    </div>
</body>
</html>
